# cargo-deny — hardwired dependency policy for KeyVault
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]
all-features = false
no-default-features = false
# Exclude Tauri desktop host from deny graph (heavy transitive; audited via SAST/npm)
exclude = ["keyvault-desktop"]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # Informational "unmaintained" (not a vulnerability). No chrono release
    # clears RUSTSEC-2026-0543; the suggested replacements are different crates
    # (jiff, time). VaultItem timestamps are chrono DateTime<Utc> values stored
    # as RFC3339 and serialized on the daemon API, so a crate swap is a schema
    # change rather than a security bump. Revisit by the expiry.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no patched release; timestamp migration is a separate schema change", expiry = "2027-02-18" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "0BSD",
    "NCSA",
    "CDLA-Permissive-2.0",
    # sqlcipher-src (optional SQLCipher build of libsqlite3-sys, enabled by
    # `cargo deny --all-features` via vault-core's sqlcipher feature) vendors
    # SQLite under the Blessing and libtomcrypt under WTFPL. Both are
    # permissive. They show up as their own crate license only once rusqlite
    # 0.43 / libsqlite3-sys 0.40 is resolved.
    "blessing",
    "WTFPL",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
