# cargo-audit advisory policy.
# Unmaintained crates stay warnings (the SAST job does not pass --deny warnings).
# Do not ignore vulnerabilities here. cargo-audit has no expiry field, and
# deny.toml does not list the advisory below: keyvault-desktop (the only crate
# that pulls glib) is excluded from the cargo-deny graph. The expires comment
# is enforced by scripts/check_cargo_audit_ignores.py in the cargo-audit SAST
# job. The ignore is valid through that date and fails the job on the next day.

[advisories]
ignore = [
    # RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g — glib::VariantStrIter unsoundness,
    # patched in glib >= 0.20.0. Tauri 2.12.6 still pulls gtk ^0.18 → glib 0.18.5.
    # Variant::array_iter_str is not called by gtk, webkit2gtk, wry, tauri, or
    # this repo. Re-review when Tauri publishes a gtk stack on glib >= 0.20.
    # expires: 2027-02-18
    "RUSTSEC-2024-0429",
]
