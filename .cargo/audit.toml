# cargo-audit advisory policy.
# Unmaintained crates stay warnings (the SAST job does not pass --deny warnings).
# Do not ignore vulnerabilities here. The single ignore below is informational
# (unsound) and is time-boxed in deny.toml (expires 2027-02-18).

[advisories]
ignore = [
    # RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g — glib::VariantStrIter unsoundness,
    # patched in glib >= 0.20.0. Tauri 2.12.6 still pulls gtk ^0.18 → glib 0.18.5.
    # Variant::array_iter_str is not called by gtk, webkit2gtk, wry, tauri, or
    # this repo. Re-review with the deny.toml expiry (2027-02-18) or sooner if
    # Tauri publishes a gtk stack on glib >= 0.20.
    "RUSTSEC-2024-0429",
]
