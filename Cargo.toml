[workspace]
resolver = "2"
members = [
    "crates/vault-core",
    "crates/vault-daemon",
    "crates/vault-ffi",
    "crates/vault-native-host",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/vault-core",
    "crates/vault-daemon",
    "crates/vault-ffi",
    "crates/vault-native-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["KeyVault Contributors"]
repository = "https://github.com/taroo0ooq/keyvault"

[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
argon2 = "0.5"
aes-gcm = "0.11"
chacha20poly1305 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# Default: plain bundled SQLite + field-level AEAD (KI-001 interim).
# Opt-in full-file SQLCipher: --features vault-core/sqlcipher
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
getrandom = "0.2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
