# SAST + secrets + dependency policy — hardwired fail-closed
# Invoked by primary CI (workflow_call) and on schedule / push / PR.
name: SAST

# Auto runs only via primary CI (workflow_call) + weekly schedule.
# Avoid duplicate concurrent runs that starve the Actions queue.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.88.14
        with:
          # Action already fails the job on verified findings; do not pass --fail twice.
          extra_args: --only-verified --results=verified

  secret-gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks detect (working tree, fail on leaks)
        # Scan current tree (not full history of public TOTP RFC vectors).
        # TruffleHog covers verified secrets across git history.
        run: gitleaks detect --source . --no-git -v --redact --exit-code 1 --config .gitleaks.toml

  codeql:
    name: CodeQL (Rust + JS/TS)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust, javascript-typescript
          queries: security-extended,security-and-quality

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust crates (CodeQL extract; exclude Tauri desktop)
        run: cargo build -p vault-core -p vault-daemon -p vault-ffi -p vault-native-host

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust-js"

  rust-audit:
    name: cargo-audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fail on known vulnerabilities; unmaintained crates are reported but do not block
      # until an upgrade path is chosen (see Docs/CI.md).
      - name: cargo audit
        run: cargo audit

  rust-deny:
    name: cargo-deny (licenses / bans / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  rust-clippy-test:
    name: clippy + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: clippy (deny warnings; exclude Tauri desktop host)
        run: |
          cargo clippy -p vault-core -p vault-daemon -p vault-ffi -p vault-native-host \
            --all-targets -- -D warnings

      - name: unit / integration tests
        run: |
          cargo test -p vault-core
          cargo test -p vault-daemon
          cargo test -p vault-ffi
          cargo test -p vault-native-host

  semgrep:
    name: Semgrep (security + secrets rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep CI (fail on findings)
        run: |
          # Secrets + security-audit packs (fail-closed).
          # Exclude: intentional Rust unsafe (FFI/DPAPI), Dependabot cooldown style,
          # and loopback HTTP used by local daemon clients.
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan \
              --config p/security-audit \
              --config p/secrets \
              --exclude-rule rust.lang.security.unsafe-usage.unsafe-usage \
              --exclude-rule package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown \
              --exclude-rule typescript.react.security.react-insecure-request.react-insecure-request \
              --exclude-rule javascript.lang.security.audit.detect-insecure-websocket.detect-insecure-websocket \
              --error \
              --metrics=off \
              .

  npm-audit-extension:
    name: npm audit (extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: npm ci + audit (production + high+)
        working-directory: apps/extension
        run: |
          npm ci
          npm audit --audit-level=high

  npm-audit-desktop:
    name: npm audit (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: npm ci + audit (high+)
        working-directory: apps/desktop
        run: |
          npm ci
          npm audit --audit-level=high

  flutter-analyzer:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get / analyze / test
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
