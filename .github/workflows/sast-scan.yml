# SAST + secrets + dependency policy — hardwired fail-closed
# Invoked by primary CI (workflow_call) and on schedule / push / PR.
name: SAST

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.88.14
        with:
          extra_args: --only-verified --results=verified --fail

  secret-gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  codeql:
    name: CodeQL (Rust + JS/TS)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust, javascript-typescript
          queries: security-extended,security-and-quality

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust crates (CodeQL extract; exclude Tauri desktop)
        run: cargo build -p vault-core -p vault-daemon -p vault-ffi -p vault-native-host

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust-js"

  rust-audit:
    name: cargo-audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (deny warnings)
        run: cargo audit --deny warnings

  rust-deny:
    name: cargo-deny (licenses / bans / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  rust-clippy-test:
    name: clippy + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: clippy (deny warnings; exclude Tauri desktop host)
        run: |
          cargo clippy -p vault-core -p vault-daemon -p vault-ffi -p vault-native-host \
            --all-targets -- -D warnings

      - name: unit / integration tests
        run: |
          cargo test -p vault-core
          cargo test -p vault-daemon
          cargo test -p vault-ffi
          cargo test -p vault-native-host

  semgrep:
    name: Semgrep (security + secrets rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep CI (fail on findings)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan \
              --config p/ci \
              --config p/security-audit \
              --config p/secrets \
              --config p/rust \
              --error \
              --metrics=off \
              .

  npm-audit-extension:
    name: npm audit (extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: npm ci + audit (production + high+)
        working-directory: apps/extension
        run: |
          npm ci
          npm audit --audit-level=high

  npm-audit-desktop:
    name: npm audit (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: npm ci + audit (high+)
        working-directory: apps/desktop
        run: |
          npm ci
          npm audit --audit-level=high

  flutter-analyzer:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get / analyze / test
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
