# Extension Playwright E2E — hardwired; fails closed (no no-op skip when package exists)
name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Extension Playwright suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Require extension package
        run: test -f apps/extension/package.json

      - name: Build vault_daemon for reveal e2e
        run: cargo build -p vault-daemon --release

      - name: Install & build extension
        working-directory: apps/extension
        run: |
          npm ci
          npm run build
          npm run test:unit

      - name: Install Playwright Chromium
        working-directory: apps/extension
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/extension
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/extension/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Open GitHub Issue on Playwright failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const templatePath = '.github/templates/bug_report_template.md';
            let template = fs.existsSync(templatePath)
              ? fs.readFileSync(templatePath, 'utf8')
              : '## Automated bug report\n';

            const filled = template
              .replaceAll('{{RUN_ID}}', String(context.runId))
              .replaceAll('{{COMMIT_SHA}}', context.sha)
              .replaceAll('{{BRANCH}}', context.ref)
              .replaceAll('{{WORKFLOW}}', context.workflow)
              .replaceAll('{{ACTOR}}', context.actor)
              .replaceAll(
                '{{RUN_URL}}',
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              );

            const title = `[E2E] Playwright failure — ${context.sha.substring(0, 7)}`;
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: filled,
                labels: ['bug', 'e2e', 'automated', 'playwright'],
              });
            } catch (e) {
              core.warning(e.message);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: filled,
              });
            }
