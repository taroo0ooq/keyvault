# vault-ffi host + Android jniLibs — part of primary CI path
name: vault-ffi

# Auto runs only via primary CI (workflow_call).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: vault-ffi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Build & test vault-ffi (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test vault-core + vault-ffi
        run: |
          cargo test -p vault-core
          cargo test -p vault-ffi

      - name: Release build vault-ffi
        run: cargo build -p vault-ffi --release

      - name: Upload host library
        uses: actions/upload-artifact@v7
        with:
          name: vault-ffi-linux-x64
          path: target/release/libvault_ffi.so
          if-no-files-found: error

  android:
    name: Cross-build vault-ffi (Android)
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o apps/mobile/android/app/src/main/jniLibs \
            build -p vault-ffi --release
          find apps/mobile/android/app/src/main/jniLibs -type f -ls

      - name: Upload Android jniLibs
        uses: actions/upload-artifact@v7
        with:
          name: vault-ffi-android-jniLibs
          path: apps/mobile/android/app/src/main/jniLibs/**
          if-no-files-found: error
