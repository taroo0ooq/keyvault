    severity: "low"
    description: "Multi-platform footprint matrix (macOS/Linux desktop) not run in this session"
    mitigation: "Run measure scripts on each release host"
  - id: "KI-061"
    severity: "low"
    description: "Full UI idle RAM automation not implemented"
    mitigation: "Extend measure script or CI smoke with desktop"
  - id: "KI-062"
    severity: "low"
    description: "Live Miro board not resynced (MCP daily API limit)"
    mitigation: "Resync from docs/miro-board-seed.md when quota resets"
  - id: "KI-001"
    severity: "medium"
    description: "SQLCipher native C lib still not linked"
    mitigation: "Field-level AEAD interim; tracked from Phase 1"
