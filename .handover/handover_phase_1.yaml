    severity: "medium"
    description: "Native SQLCipher C library not linked; schema is SQLCipher-compatible with app-layer AEAD field encryption"
    mitigation: "Swap rusqlite feature to bundled-sqlcipher when native toolchain ready; zero-knowledge preserved"
  - id: "KI-002"
    severity: "low"
    description: "Miro board was offline seed-only until MCP auth"
    mitigation: "Board populated from docs/miro-board-seed.md; Phase 1 status synced 2026-08-04"
    status: "Resolved"
  - id: "KI-003"
    severity: "low"
    description: "Windows MSVC link.exe shadowed by Git usr/bin/link; build uses windows-gnu + WinLibs MinGW"
    mitigation: "Document PATH ordering; CI uses ubuntu-latest MSVC-free hosts"
